[project]
name = "fbrl"
version = "0.1.0"
description = "Feedback vs. internal verification in RL post-training (CSE 5100 project)"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2", "pyyaml>=6", "typer>=0.16"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]
# Training stack. uv installs it by default; `pip install -e .` gets only the envs and harness.
train = [
    "trl>=1.16",
    "vllm>=0.30; sys_platform == 'linux'",
    "peft>=0.17",
    "wandb>=0.22",
    "datasets>=4.0",
    "nvidia-ml-py>=12",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["fbrl", "gridenvs", "harness"]

[tool.uv]
default-groups = ["dev", "train"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 88
