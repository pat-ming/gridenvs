experiment:
  name: grpo
  tags: []
  seed: 0

model:
  name: Qwen/Qwen3-0.6B
  chat_template_kwargs: {enable_thinking: false}
  lora: null

env:
  name: grid4
  mode: "true"  # none | true | noise | residual, or a schedule [[0, "true"], [200, none]]
  instances: {set_name: [spec], m: [1, 2]}
  slack: [0, 1]  # H = m + slack
  noise_sizes: null
  max_reply_tokens: 32

eval:
  every: 25
  at_start: true
  instances: {set_name: [spec], m: [1, 2]}
  slack: [0]
  modes: [none, "true", counterfactual]
  n_instances: 32
  samples: 4
  temperature: 1.0

tracking:
  wandb: {enabled: true, project: fbrl, group: dev}
  best: {metric: null}
  rollout_table_every: 25

grpo:
  max_steps: 300
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 4
  num_generations: 8
  learning_rate: 1.0e-6
  beta: 0.0
  bf16: true
  model_init_kwargs: {dtype: bfloat16}
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3
  vllm_max_model_length: 4096
  max_completion_length: 1024
  logging_steps: 1
  save_steps: 100
  log_completions: false
