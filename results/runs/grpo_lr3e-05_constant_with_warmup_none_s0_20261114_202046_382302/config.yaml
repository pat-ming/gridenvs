experiment:
  name: grpo_lr{grpo.learning_rate}_{grpo.lr_scheduler_type}_{env.mode}_s{experiment.seed}
  tags:
  - grpo
  - '{model.name}'
  - mode-{env.mode}
  - '{env.instances.set_name}'
  notes: 'LR sweep on the none arm: lr {grpo.learning_rate}, {grpo.lr_scheduler_type}.
    Does GRPO learn at all with a larger step?'
  seed: 0
model:
  name: /engrfs/project/netanel.raviv/motti_k/fbrl/models/sft-qwen3-0.6b
  chat_template_kwargs:
    enable_thinking: false
  lora: null
