experiment:
  name: grpo_{model.name}_{env.mode}_s{experiment.seed}
  tags:
  - grpo
  - '{model.name}'
  - mode-{env.mode}
  - '{env.instances.set_name}'
  notes: 'GRPO from the 0.6B-Base warm start on distinct + ineq, feedback mode {env.mode},
    seed {experiment.seed}: does GRPO learn, and does training with the true line
    change no-feedback success and counterfactual reliance?'
  seed: 0
model:
  name: /engrfs/project/netanel.raviv/motti_k/fbrl/models/sft-qwen3-0.6b
  chat_template_kwargs:
    enable_thinking: false
  lora: null
