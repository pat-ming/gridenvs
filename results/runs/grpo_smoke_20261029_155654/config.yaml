experiment:
  name: grpo_smoke
  tags:
  - smoke
  seed: 0
model:
  name: Qwen/Qwen3-0.6B
  lora: null
env:
  name: toy_constraint
  condition: A
tracking:
  wandb:
    enabled: true
    project: fbrl
    group: smoke
  best:
    metric: null
  rollout_table_every: 5
grpo:
  max_steps: 20
  per_device_train_batch_size: 8
  num_generations: 8
  max_completion_length: 768
  max_tool_calling_iterations: 6
  learning_rate: 1.0e-06
  bf16: true
  model_init_kwargs:
    dtype: bfloat16
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3
  chat_template_kwargs:
    enable_thinking: false
  logging_steps: 1
  save_steps: 10
  log_completions: true
